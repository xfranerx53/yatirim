name: Günlük skor
on:
  schedule:
    - cron: "40 15 * * 1-5"
  workflow_dispatch:
  push:
    paths: ["araclar/skor.py", "semboller.json", ".github/workflows/skor.yml"]
permissions:
  contents: write
jobs:
  skor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python araclar/skor.py
      - run: |
          git config user.name "skor-bot"; git config user.email "bot@users.noreply.github.com"
          git add skor.json gecmis.json
          git commit -m "Skor güncellendi [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && echo "push OK" && exit 0
            echo "push denemesi $i başarısız, bekleniyor"; sleep 15
          done
          echo "push 5 denemede başarısız"; exit 1
