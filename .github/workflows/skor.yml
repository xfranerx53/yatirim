name: Günlük skor
on:
  schedule:
    - cron: "40 15 * * 1-5"
  workflow_dispatch:
  push:
    paths: ["araclar/skor.py", "semboller.json", ".github/workflows/skor.yml"]
permissions:
  contents: write
jobs:
  skor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python araclar/skor.py
      - run: |
          git config user.name "skor-bot"; git config user.email "bot@users.noreply.github.com"
          git add skor.json && git commit -m "Skor güncellendi [skip ci]" && git pull --rebase && git push || true
